<text class="t3" x="859" y="681">GENERAL NOTES</text><text class="t3" x="859" y="691">1. STRUCTURE: STEEL FRAME, COLUMNS AND BEAMS ENCASED IN CONCRETE.</text><text class="t3" x="859" y="701">2. CONCRETE CORE SHEAR WALLS TO FLOOR 17.</text><text class="t3" x="859" y="711">3. CURTAIN WALL: BRONZE MULLIONS, MUNTZ METAL SPANDRELS, 1/4&quot; TINTED PLATE GLASS.</text><text class="t3" x="859" y="721">4. SERPENTINE MARBLE CLADDING ON THE SPINE.</text><text class="t3" x="859" y="731">5. TRAVERTINE LOBBY WALLS AND COLUMN CLADDING.</text><text class="t3" x="859" y="741">6. GRANITE LOBBY FLOOR.</text><text class="t3" x="859" y="751">7. 18 PASSENGER ELEVATORS IN THE CORE.</text><text class="t3" x="859" y="761">8. 3 BASEMENT LEVELS UNDER THE FULL LOT.</text>
<text class="t1" x="859" y="779">SEAGRAM BUILDING</text>
<text class="t2" x="859" y="792">375 PARK AVENUE, NEW YORK</text>
<text class="t2" x="859" y="805">TYPICAL OFFICE FLOOR PLAN · LEVELS 11–38 · SCALE 1:70</text>
